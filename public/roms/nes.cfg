MEMORY {
    HEADER:  start = $0000, size = $0010, type = ro;  # 16-byte NES Header
    ZP:      start = $0000, size = $0100, type = rw;  # Zero Page
    STACK:   start = $0100, size = $0100, type = rw;  # Stack
    RAM:     start = $0200, size = $0600, type = rw;  # Work RAM
    PRG:     start = $8000, size = $7FFA, type = ro;  # PRG-ROM (32 KB)
    VECTORS: start = $FFFA, size = $0006, type = ro;  # Interrupt vectors
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    CODE:     load = PRG, type = ro;
    VECTORS:  load = VECTORS, type = ro, start = $FFFA;
}
